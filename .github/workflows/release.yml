name: Engine checks and releases

on:
  push:
    branches: [main]
    tags: ['engine-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
      release_tag:
        type: string
        default: engine-v0.4.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/package_engine.py
      - run: cat LICENSE LICENSE.libdisplay-info > build/release/LICENSES.txt
      - id: versions
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          matrix = [{'version': v, 'runner': r} for v in json.load(open('release.json'))['sources'] for r in ['ubuntu-22.04', 'ubuntu-22.04-arm']]
          print('value=' + json.dumps({'include': matrix}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: build/release/*

  binary:
    if: (startsWith(github.ref, 'refs/tags/engine-v') && !github.event.forced) || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.93.0'
          rustflags: ''
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake meson ninja-build hwdata libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libfontconfig-dev libpixman-1-dev libpam0g-dev libdav1d-dev libssl-dev libpulse-dev libclang-dev libxcb1-dev libx11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/portable-target
            build/portable-native
          key: compositor-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.version }}-rust1.93-glibc2.35-${{ hashFiles('runtime.rs', 'loader.rs', 'animation.rs', 'backdrop.rs', 'surface_state.rs', 'patches/*', 'glass.frag', 'scripts/build_binary.py', 'build.py') }}
          restore-keys: compositor-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.version }}-rust1.93-glibc2.35-
      - name: Build portable compositor
        env:
          COSMIC_VERSION: ${{ matrix.version }}
        run: python scripts/build_binary.py --cosmic-version "$COSMIC_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-compositor-${{ matrix.version }}-${{ runner.arch }}
          path: build/release/*.xz

  release:
    if: (startsWith(github.ref, 'refs/tags/engine-v') && !github.event.forced) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [check, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-package
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - name: Publish engine sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
          NOTES: 'Compositor-only shader engine for COSMIC Forge. Validates the exact renderer revision and removes panel, Settings and greeter package guards. Existing matching binaries are reused while previous launchers are upgraded in place. Prebuilt binaries cover COSMIC 1.10/1.11 on x86_64 and ARM64 with glibc 2.35+. Restore selects the original system compositor and preserves preferences.'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" release/* --verify-tag --latest --title "$TAG" --notes "$NOTES"
          fi
