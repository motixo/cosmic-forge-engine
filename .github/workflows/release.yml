name: Engine checks and releases

on:
  push:
    branches: [main]
    tags: ['engine-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [panel, compositor, greeter, all]
        default: panel
      publish:
        type: boolean
        default: false
      release_tag:
        type: string
        default: engine-v0.3.0

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/package_engine.py
      - run: cat LICENSE LICENSE.libdisplay-info panel/NOTICE greeter/NOTICE > build/release/LICENSES.txt
      - id: versions
        env:
          COMPONENT: ${{ inputs.component || 'all' }}
        run: |
          python - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          selected = os.environ['COMPONENT']
          components = ['compositor', 'panel', 'greeter'] if selected == 'all' else [selected]
          matrix = [{'component': c, 'version': v, 'runner': r} for c in components for v in json.load(open('release.json'))['sources'] for r in (['ubuntu-24.04', 'ubuntu-24.04-arm'] if c == 'greeter' else ['ubuntu-22.04', 'ubuntu-22.04-arm'])]
          print('value=' + json.dumps({'include': matrix}))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: build/release/*

  binary:
    if: (startsWith(github.ref, 'refs/tags/engine-v') && !github.event.forced) || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.93.0'
          rustflags: ''
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake meson ninja-build hwdata libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libfontconfig-dev libpixman-1-dev libpam0g-dev libdav1d-dev libssl-dev libpulse-dev libclang-dev libxcb1-dev libx11-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/portable-target
            build/portable-native
          key: ${{ matrix.component }}-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.version }}-rust1.93-glibc2.35-${{ hashFiles('runtime.rs', 'loader.rs', 'patches/*', 'glass.frag', 'scripts/build_binary.py', 'build.py', 'panel/*', 'greeter/*') }}
          restore-keys: ${{ matrix.component }}-${{ matrix.runner }}-${{ runner.arch }}-${{ matrix.version }}-rust1.93-glibc2.35-
      - name: Build portable component
        env:
          COSMIC_VERSION: ${{ matrix.version }}
          COMPONENT: ${{ matrix.component }}
        run: python scripts/build_binary.py --component "$COMPONENT" --cosmic-version "$COSMIC_VERSION"
      - name: Check the sandbox artwork decoder
        if: matrix.component == 'greeter'
        env:
          FORGE_MEDIA_BINARY: build/bin/cosmic-greeter
        run: python -m unittest discover -s tests -p 'test_media.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.component }}-${{ matrix.version }}-${{ runner.arch }}
          path: build/release/*.xz

  release:
    if: (startsWith(github.ref, 'refs/tags/engine-v') && !github.event.forced) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [check, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-package
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release
      - name: Publish engine sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --latest --title "$TAG" --notes 'Independent Forge compositor, panel and lock screen components. Prebuilt binaries for COSMIC 1.10 and 1.11 on x86_64 and ARM64; glibc 2.35+ for compositor/panel and 2.39+ for lock screen. Supports Arch, Fedora, Ubuntu and Pop!_OS. Restore selects original system components and preserves preferences.'
          fi
