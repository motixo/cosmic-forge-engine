name: Engine checks and releases

on:
  push:
    branches: [main]
    tags: ['engine-v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/package_engine.py
      - uses: actions/upload-artifact@v4
        with:
          name: engine-package
          path: build/release/cosmic-forge-engine.json

  release:
    if: startsWith(github.ref, 'refs/tags/engine-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: engine-package
          path: release
      - name: Publish engine sources
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/cosmic-forge-engine.json --verify-tag --latest --title "$TAG" --notes 'Independent compositor engine package for COSMIC Forge. Install or update from Forge Settings. The bundle includes its ABI and renderer revision.'
